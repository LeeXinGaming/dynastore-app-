services:
  - type: web
    name: dynastore-app
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: python render_server.py
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
    disk:
      name: dynastore-storage
      mountPath: /opt/render/project/src/storage
      sizeGB: 10
